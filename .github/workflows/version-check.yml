# Caller for the reusable github-workflows version check: raises (and
# auto-closes) an issue here if this repo ever pins a frozen @vN major. See
# flungo/github-workflows docs/runbooks/adopting-version-check.md.
name: github-workflows version check

on:
  schedule:
    - cron: '0 7 * * 1' # weekly
  workflow_dispatch:

jobs:
  version-check:
    permissions:
      contents: read
      issues: write
    uses: flungo/github-workflows/.github/workflows/version-check.yml@v1
