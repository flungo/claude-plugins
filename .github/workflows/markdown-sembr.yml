# Caller for the reusable semantic-line-break check in flungo/github-workflows.
# Flags two sentences sharing a source line — the one MUST rule of sembr.org.
# See that repo's docs/runbooks/adopting-markdown-workflows.md.
#
# Deliberately unfiltered: a workflow skipped by `paths:` never creates its
# check run, so a required context would sit at Expected forever. This one is
# meant to become required across the fleet, so it runs on everything.
name: Markdown semantic line breaks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown-sembr:
    uses: flungo/github-workflows/.github/workflows/markdown-sembr.yml@v2
    with:
      # Same exclusion as .markdownlint-cli2.jsonc, for the same reason: the
      # eval fixtures are test inputs, not documentation. Reflowing them would
      # change what the evals feed their agents.
      ignore: plugins/*/evals/fixtures/**
